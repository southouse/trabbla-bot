name: daily-phrase

on:
  schedule:
    # 23:21 UTC = 08:21 KST (다음 날). GitHub Actions는 혼잡 시 지연되거나 드물게 건너뛴다.
    # 건너뛰어도 포인터가 남아 있어 다음 실행이 밀린 회차를 따라잡는다.
    - cron: "21 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-phrase
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send due phrases
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_next.py

      - name: Commit pointer
        run: |
          if git diff --quiet state/pointer.txt; then
            echo "포인터 변화 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pointer.txt
          git commit -m "chore: advance pointer to Day $(cat state/pointer.txt)"
          git push
